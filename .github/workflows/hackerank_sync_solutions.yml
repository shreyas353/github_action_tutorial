name: Auto-Publish HackerRank Solutions

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  push:
    branches:
      - main

jobs:
  update-solutions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v3

      - name: Clone HackerRank Solutions Repo with Authentication
        run: git clone https://${{ secrets.GH_PAT }}@github.com/shreyas353/hackerrank_problems.git ~/hackerrank

      - name: Sync HackerRank Solutions
        run: |
          cp -r ~/hackerrank/* . || echo "No files to copy"
          git config --global user.email "shreyasgupta1707@gmail.com"
          git config --global user.name "shreyasgupta1707"
          git add .
          git commit -m "Auto-update HackerRank solutions - $(date)" || echo "No changes to commit"
          git push
